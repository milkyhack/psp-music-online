; PPSSPP network preset for PSP Music Online (homebrew HTTP to LAN server).
; Merged via --appendconfig= in tools/run_ppsspp_music.sh

[General]
EnablePlugins = True
FirstRun = False

[Network]
EnableWlan = True
EnableAdhocServer = False
PortOffset = 0
EnableUPnP = False
InfrastructureAutoDNS = False
InfrastructureUsername = PSPMusic
MacAddress = 12:34:56:78:9A:BC

[SystemParam]
Language = 1
